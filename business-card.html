<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingeborg Sili Østgaard - Business Card</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 3.5 / 2.333;
      background: white;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .card-content {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 40px 60px;
      position: relative;
    }

    .left-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .title-section {
      margin-bottom: 40px;
    }

    .main-title {
      font-family: 'Bitcount Prop', monospace;
      font-size: 72px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #2B7FFF;
      line-height: 1;
      margin-bottom: 8px;
    }

    .subtitle {
      font-family: 'Bitcount Prop', monospace;
      font-size: 64px;
      font-weight: 700;
      letter-spacing: 6px;
      color: #2B7FFF;
      line-height: 1;
    }

    .location {
      position: absolute;
      top: 40px;
      right: 60px;
      font-size: 18px;
      color: #2B7FFF;
      font-weight: 400;
      letter-spacing: 1px;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 10px;
    }

    .contact-link {
      font-size: 14px;
      color: #2B7FFF;
      text-decoration: underline;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .contact-link:hover {
      opacity: 0.8;
    }

    /* Gemstone decorations */
    .gems {
      position: absolute;
      right: 80px;
      top: 50%;
      transform: translateY(-50%);
      width: 300px;
      height: 300px;
    }

    .gem {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      opacity: 0.7;
    }

    .gem-1 { background: radial-gradient(circle at 30% 30%, #87CEEB, #4A90E2); top: 20px; right: 180px; width: 35px; height: 35px; }
    .gem-2 { background: radial-gradient(circle at 30% 30%, #E8B4D4, #C97EC1); top: 80px; right: 60px; width: 28px; height: 28px; }
    .gem-3 { background: radial-gradient(circle at 30% 30%, #B0E0E6, #20B2AA); top: 120px; right: 140px; width: 40px; height: 40px; }
    .gem-4 { background: radial-gradient(circle at 30% 30%, #D4A5D4, #A66FA6); top: 160px; right: 80px; width: 32px; height: 32px; }
    .gem-5 { background: radial-gradient(circle at 30% 30%, #F0E68C, #DAA520); top: 180px; right: 200px; width: 26px; height: 26px; }
    .gem-6 { background: radial-gradient(circle at 30% 30%, #D3D3D3, #A9A9A9); top: 60px; right: 240px; width: 24px; height: 24px; }
    .gem-7 { background: radial-gradient(circle at 30% 30%, #FFB6C1, #FF69B4); top: 140px; right: 30px; width: 35px; height: 35px; }
    .gem-8 { background: radial-gradient(circle at 30% 30%, #D3D3D3, #A9A9A9); top: 220px; right: 120px; width: 22px; height: 22px; }
    .gem-9 { background: radial-gradient(circle at 30% 30%, #98FB98, #90EE90); top: 30px; right: 100px; width: 28px; height: 28px; }
    .gem-10 { background: radial-gradient(circle at 30% 30%, #DDA0DD, #BA55D3); top: 250px; right: 180px; width: 30px; height: 30px; }

    .star {
      position: absolute;
      width: 24px;
      height: 24px;
      opacity: 0.6;
    }

    .star-1 { top: 50px; right: 220px; }
    .star-2 { top: 200px; right: 160px; }
    .star-3 { bottom: 80px; right: 220px; }

    @media (max-width: 768px) {
      .card-content {
        flex-direction: column;
        padding: 30px;
      }

      .main-title {
        font-size: 48px;
        letter-spacing: 6px;
      }

      .subtitle {
        font-size: 44px;
        letter-spacing: 4px;
      }

      .location {
        position: static;
        margin-bottom: 20px;
      }

      .gems {
        position: static;
        width: 100%;
        height: 200px;
        margin-top: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-content">
      <div class="left-section">
        <div class="title-section">
          <div class="main-title">INGEBORG</div>
          <div class="main-title">SILI</div>
          <div class="subtitle">ØSTGAARD</div>
        </div>
        <div class="contact-info">
          <a href="mailto:ingeborg2809@gmail.com" class="contact-link">ingeborg2809@gmail.com</a>
          <a href="tel:+4790213071" class="contact-link">+47 90 21 30 71</a>
          <a href="https://www.linkedin.com/in/ingeborg-sili-oestgaard/" target="_blank" class="contact-link">LinkedIn</a>
          <a href="IngeborgSO_CV.pdf" target="_blank" class="contact-link">CV</a>
        </div>
      </div>

      <div class="location">Oslo, Norway</div>

      <div class="gems">
        <div class="gem gem-1"></div>
        <div class="gem gem-2"></div>
        <div class="gem gem-3"></div>
        <div class="gem gem-4"></div>
        <div class="gem gem-5"></div>
        <div class="gem gem-6"></div>
        <div class="gem gem-7"></div>
        <div class="gem gem-8"></div>
        <div class="gem gem-9"></div>
        <div class="gem gem-10"></div>

        <svg class="star star-1" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5">
          <polygon points="12 2 15.09 10.26 24 10.26 17.55 15.74 20.64 24 12 18.52 3.36 24 6.45 15.74 0 10.26 8.91 10.26"/>
        </svg>
        <svg class="star star-2" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5">
          <polygon points="12 2 15.09 10.26 24 10.26 17.55 15.74 20.64 24 12 18.52 3.36 24 6.45 15.74 0 10.26 8.91 10.26"/>
        </svg>
        <svg class="star star-3" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5">
          <polygon points="12 2 15.09 10.26 24 10.26 17.55 15.74 20.64 24 12 18.52 3.36 24 6.45 15.74 0 10.26 8.91 10.26"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
