<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="Pingu.svg">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #f0f0f0;
    color: #2B2828;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    gap: 0;
  }

  .arc-track {
    position: relative;
    width: 100%;
    flex-shrink: 0;
  }

  .card {
    position: absolute;
    border-radius: 16px;
    border: none;
    overflow: hidden;
    cursor: pointer;
    will-change: transform, opacity;
    left: 50%;
    top: 0;
  }
  .card-swatch { position: absolute; inset: 0; }

  .card-index { display: none; }

  .info-panel {
    width: 100%;
    max-width: 100%;
    padding: 0 32px;
    height: 220px;
    overflow: hidden;
    text-align: left;
    flex-shrink: 0;
  }

  @keyframes fadeUp {
    from { opacity:0; }
    to   { opacity:1; }
  }

  .info-eyebrow {
    display: none;
  }
  .info-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 2.4rem; font-weight: 400; line-height: 1.05;
    color: #2B2828;
  }
  .info-desc {
    font-size: 0.86rem; line-height: 1.75;
    color: #696767; font-weight: 300; margin-bottom: 18px;
  }
  .info-pills { display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-start; }
  .pill {
    font-size: 11px; padding: 4px 12px; border-radius: 100px;
    border: none; color: #696767; background: rgba(255,255,255,0.45);
    display:inline-flex; align-items:center; gap:5px;
  }
  .pill svg { flex-shrink:0; opacity:0.75; }
  .pill.hi { border: none; color: #2B2828; background: rgba(255,255,255,0.55); }

  .nav-dots {
    display:flex; gap:7px; justify-content:center;
    margin-top:24px; align-items:center;
  }
  .dot {
    width:5px; height:5px; border-radius:50%;
    background:#E5E4E2; cursor:pointer;
    transition: width 0.4s cubic-bezier(0.34,1.3,0.64,1), background 0.3s, border-radius 0.4s;
  }
  .dot.active { width:20px; border-radius:3px; background:#2B2828; }

  .arrows { display:none; gap:10px; margin-top:18px; }
  .arrow-btn {
    width:38px; height:38px; border-radius:50%;
    border:1px solid #E5E4E2;
    background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:#2B2828;
    transition:background 0.2s, border-color 0.2s, opacity 0.25s;
  }
  .arrow-btn:hover { background:rgba(43,40,40,0.05); border-color:#BCBAB8; }
  .arrow-btn:disabled { opacity:0.2; cursor:default; }

  .snap-bar-wrap { display:none; }

  /* ── CURSOR LABEL ── */
  #cursorLabel {
    position: fixed; z-index: 9999;
    pointer-events: none;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #1d1d1f;
    border: 1px solid rgba(0,0,0,0.08);
    font-family: 'DM Sans', sans-serif;
    font-size: 11.5px;
    font-weight: 400;
    letter-spacing: 0.02em;
    padding: 6px 14px;
    border-radius: 100px;
    opacity: 0;
    transform: translate(-50%, 28px) scale(0.75);
    transition: opacity 0.18s ease, transform 0.2s cubic-bezier(0.22,1,0.36,1);
    white-space: nowrap;
  }
  #cursorLabel.visible {
    opacity: 1;
    transform: translate(-50%, 28px) scale(1);
  }

  /* ── PAGE TRANSITION ── */
  @keyframes fadeOutUp {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-18px); }
  }
  body.leaving { animation: fadeOutUp 0.35s cubic-bezier(0.4,0,1,1) forwards; pointer-events: none; }

  /* ── INTRO ANIMATIONS ── */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateX(-50%) translateY(-24px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  @keyframes fadeUpScale {
    from { opacity: 0; transform: translateY(40px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .top-gradient {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 180px;
    background: linear-gradient(#f0f0f0 5%, transparent 100%);
    pointer-events: none;
    z-index: 50;
  }
  .watermark {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.68rem;
    color: rgba(43,40,40,0.3);
    font-weight: 300;
    white-space: nowrap;
    pointer-events: none;
    z-index: 10;
    letter-spacing: 0.01em;
  }
  .site-nav   { opacity: 0; }
  .nav-dots   { opacity: 0; }
  #arcTrack   { opacity: 0; }
  #infoPanel  { opacity: 0; }

  .site-nav.intro-done   { animation: fadeDown     1.1s  cubic-bezier(0.22,1,0.36,1) 0.2s  forwards; }
  #arcTrack.intro-done   { animation: fadeUpScale  1.3s  cubic-bezier(0.22,1,0.36,1) 0.0s  forwards; }
  .nav-dots.intro-done   { animation: fadeUp       1.0s  cubic-bezier(0.22,1,0.36,1) 0.5s  forwards; }
  #infoPanel.intro-done  { animation: fadeUp       1.0s  cubic-bezier(0.22,1,0.36,1) 0.7s  forwards; }


  /* ── NAV ── */
  .site-nav {
    position: fixed;
    top: max(24px, env(safe-area-inset-top, 0px) + 12px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    z-index: 100;
    white-space: nowrap;
  }
  .site-nav a {
    text-decoration: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #999999;
    transition: opacity 0.2s;
  }
  .site-nav a:hover { opacity: 0.6; }
  .site-nav a.active { font-weight: 500; }

  /* ── STAGE ── */
  .stage {
    padding-top: max(72px, env(safe-area-inset-top, 0px) + 64px);
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  }

  /* ── RESPONSIVE SPACER ── */
  .card-info-gap { height: 28px; flex-shrink: 0; }

  @media (max-width: 430px) {
    .site-nav { padding: 4px; }
    .site-nav a { font-size: 12px; padding: 5px 14px; }
    .info-title  { font-size: 1.8rem; }
    .info-desc   { font-size: 0.82rem; line-height: 1.55; margin-bottom: 14px; }
    .info-panel  { height: 185px; padding: 0 16px; }
    .pill        { font-size: 10px; padding: 3px 9px; }
    .nav-dots    { margin-top: 14px; }
    .arrows      { margin-top: 10px; }
    .card-info-gap { height: 18px; }
  }

  @media (max-width: 360px) {
    .info-title { font-size: 1.55rem; }
    .info-desc  { display: none; }
    .info-panel { height: 90px; }
    .card-info-gap { height: 12px; }
  }

  @media (max-height: 650px) and (orientation: portrait) {
    .info-desc  { font-size: 0.80rem; line-height: 1.5; }
    .info-panel { height: 185px; }
    .nav-dots   { margin-top: 10px; }
    .arrows     { margin-top: 8px; }
    .card-info-gap { height: 16px; }
  }

  @media (max-height: 500px) and (orientation: landscape) {
    .site-nav, .info-panel, .nav-dots, .arrows { display: none !important; }
    .stage { justify-content: center; padding: 0; }
  }

  /* ── CASE STUDY LIGHTBOX ── */
  @keyframes overlayIn  { from { opacity:0; } to { opacity:1; } }
  @keyframes overlayOut { from { opacity:1; } to { opacity:0; } }
  @keyframes imgSlideIn { from { opacity:0; transform:translateY(32px) scale(0.97); } to { opacity:1; transform:translateY(0) scale(1); } }
  @keyframes imgSlideOut{ from { opacity:1; transform:translateY(0) scale(1); } to { opacity:0; transform:translateY(24px) scale(0.97); } }

  #caseOverlay {
    display: none;
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    overflow-y: auto;
    overscroll-behavior: none;
    cursor: zoom-out;
  }
  #caseOverlay.open    { display: flex; align-items: flex-start; justify-content: center; animation: overlayIn  0.35s cubic-bezier(0.22,1,0.36,1) forwards; }
  #caseOverlay.closing { animation: overlayOut 0.28s cubic-bezier(0.4,0,1,1) forwards; pointer-events:none; }
  #caseOverlay.open #caseImg    { animation: imgSlideIn  0.45s cubic-bezier(0.22,1,0.36,1) 0.05s both; }
  #caseOverlay.closing #caseImg { animation: imgSlideOut 0.28s cubic-bezier(0.4,0,1,1) forwards; }
  #caseOverlay img {
    width: 100%;
    max-width: 1400px;
    display: block;
    margin: 80px auto 40px;
    border-radius: 12px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    cursor: default;
  }
  #caseClose {
    display: none;
    position: fixed; top: 20px; right: 24px;
    z-index: 1100;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff; font-size: 18px; line-height: 36px; text-align: center;
    cursor: pointer; backdrop-filter: blur(8px);
    transition: background 0.15s;
  }
  #caseClose:hover { background: rgba(255,255,255,0.28); }
  #caseTopBtn {
    position: fixed; bottom: 28px; right: 24px;
    z-index: 1100;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff; font-size: 16px; line-height: 36px; text-align: center;
    cursor: pointer; backdrop-filter: blur(8px);
    transition: background 0.15s, opacity 0.2s;
    opacity: 0; pointer-events: none;
  }
  #caseTopBtn.visible { opacity: 1; pointer-events: auto; }
  #caseTopBtn:hover { background: rgba(255,255,255,0.28); }
  #caseSpinner {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 36px; height: 36px;
    border: 2.5px solid rgba(255,255,255,0.2);
    border-top-color: rgba(255,255,255,0.85);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  #caseOverlay.loaded #caseSpinner { display: none; }
  #caseOverlay:not(.loaded) #caseImg { opacity: 0; }
</style>
</head>
<body>
<div class="top-gradient"></div>
<p class="watermark">Designed in Figma &nbsp;·&nbsp; Vibe coded with Claude</p>
<div id="cursorLabel">Click to open</div>
<div id="caseOverlay">
  <div id="caseSpinner"></div>
  <img id="caseImg" src="" alt="Case study">
</div>
<span class="close-btn" id="caseClose">&#x2715;</span>
<button id="caseTopBtn" title="Back to top">&#x2191;</button>
<nav class="site-nav">
  <a href="cards.html" class="active">Projects</a>
  <a href="about.html">About</a>
</nav>

<div class="stage">
  <div class="arc-track" id="arcTrack">
    <div class="snap-bar-wrap" id="snapBarWrap">
      <div class="snap-bar-fill" id="snapBarFill"></div>
    </div>
  </div>
  <div class="card-info-gap"></div>
  <div class="info-panel" id="infoPanel"></div>

  <div class="nav-dots" id="navDots"></div>
  <div class="arrows">
    <button class="arrow-btn" id="btnPrev"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="arrow-btn" id="btnNext"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>



<script>
const NATIVE_W = 1054;
const NATIVE_H = 701;
const FILL = 0.52;

const projects = [
  { title:"Bloom Health",    role:"Mobile App · 2024",  desc:"Redesigned core tracking flows to reduce cognitive load, introducing ambient check-ins that fit naturally into daily routines.",                         pills:[{text:"↑ 38% retention",hi:true,icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"2 12 6 7 10 9 14 4\"/><\/svg>"},{text:"4.8 ★",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"8 2 10 6 14 6.5 11 9.5 11.5 14 8 12 4.5 14 5 9.5 2 6.5 6 6\"/><\/svg>"},{text:"iOS & Android",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4.5\" y=\"1\" width=\"7\" height=\"14\" rx=\"2\"/><line x1=\"7\" y1=\"12\" x2=\"9\" y2=\"12\"/><\/svg>"}],          color:"#c8a882", image:"CardCover/Card.png" },
  { title:"Altek AI",         role:"Freelance · 2025–present",   desc:"Improved the SaaS training dashboard hotels use to teach their AI assistants, supporting hotels like The Well, Britannia and The Thief with better guest answers and smoother operations.",                pills:[{text:"$100K ARR",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"8\" cy=\"8\" r=\"6\"/><path d=\"M8 5v6M6.5 6.5h3a1 1 0 010 2H7a1 1 0 000 2h3\"/><\/svg>"},{text:"60+ hotels",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"7\" width=\"12\" height=\"8\"/><path d=\"M5 15V9h6v6\"/><path d=\"M2 7l6-5 6 5\"/><\/svg>"},{text:"NOK 5M pre-seed",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2C6 2 4 8 4 14M4 14c2-4 5-6 8-7\"/><\/svg>"}],           color:"#2c4a6e", image:"CardCover/AltekCover.png" },
  { title:"Kron (Storebrand)", role:"Fintech Internship · 2025",    desc:"Designed the next step for Storebrands investment app, used by 80,000+ users. Led the full design process as sole UX designer, from 54 user interviews to an interactive prototype presented to executive leadership.",               pills:[{text:"54 interviews",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 8a3 3 0 100-6 3 3 0 000 6zM14 14s.5-5-4-5M6 8a3 3 0 100-6 3 3 0 000 6zM2 14s-.5-5 4-5\"/><\/svg>"},{text:"1,022 survey responses",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"2 12 6 7 10 9 14 4\"/><\/svg>"},{text:"80K+ app users",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 8a3 3 0 100-6 3 3 0 000 6zM14 14s.5-5-4-5M6 8a3 3 0 100-6 3 3 0 000 6zM2 14s-.5-5 4-5\"/><\/svg>"}],    color:"#b8d48a", image:"CardCover/KronCover.png" },
  { title:"Skatteetaten",     role:"Master's thesis · University of Oslo · 2026",   desc:"A qualitative study with 12 adults with dyslexia and dyscalculia, exploring how they experience Norway's tax system, and a design proposal for a more accessible tax card.",                pills:[{text:"12 participants",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 8a3 3 0 100-6 3 3 0 000 6zM14 14s.5-5-4-5M6 8a3 3 0 100-6 3 3 0 000 6zM2 14s-.5-5 4-5\"/><\/svg>"},{text:"40+ hours raw data",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"8\" cy=\"8\" r=\"6\"/><polyline points=\"8 4 8 8 11 10\"/><\/svg>"},{text:"200 page thesis",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2h8a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V4a2 2 0 012-2z\"/><line x1=\"6\" y1=\"6\" x2=\"10\" y2=\"6\"/><line x1=\"6\" y1=\"9\" x2=\"10\" y2=\"9\"/><line x1=\"6\" y1=\"12\" x2=\"8\" y2=\"12\"/><\/svg>"}],           color:"#4A1028", image:"CardCover/SkatteetatenCover.png" },
  { title:"Telenor",           role:"Telecom Internship · 2024",   desc:"Designed Business Pro for Norway's largest telecom, a simplified mobile CRM helping small and medium businesses manage customers with minimal manual input. Led UX across 51 participants and 6 prototype cycles.",                  pills:[{text:"↓ 40% complexity",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"2 12 6 7 10 9 14 4\"/><\/svg>"},{text:"51 participants",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 8a3 3 0 100-6 3 3 0 000 6zM14 14s.5-5-4-5M6 8a3 3 0 100-6 3 3 0 000 6zM2 14s-.5-5 4-5\"/><\/svg>"},{text:"86K+ B2B market",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"7\" width=\"12\" height=\"8\"/><path d=\"M5 15V9h6v6\"/><path d=\"M2 7l6-5 6 5\"/><\/svg>"}],   color:"#c47a9f", image:"CardCover/TelenorCover.png"},
  { title:"Nabostylisten",         role:"Part-time · 2024",      desc:"Redesigned the mobile booking flow for a beauty-at-home platform, cutting task time by 74.5% and lifting satisfaction from 3.1 to 7.5. The relaunch earned coverage in TV 2 and MinMote.",                              pills:[{text:"↓ 74.5% task time",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"2 12 6 7 10 9 14 4\"/><\/svg>"},{text:"3.1 → 7.5 satisfaction",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"8 2 10 6 14 6.5 11 9.5 11.5 14 8 12 4.5 14 5 9.5 2 6.5 6 6\"/><\/svg>"},{text:"TV 2 featured",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"1\" y=\"4\" width=\"14\" height=\"9\" rx=\"1\"/><line x1=\"5\" y1=\"15\" x2=\"11\" y2=\"15\"/><line x1=\"8\" y1=\"13\" x2=\"8\" y2=\"15\"/><\/svg>"}], color:"#2a4a2e", image:"CardCover/NabostylistenCover.png"},
  { title:"DFØ",          role:"University Project · 2024",     desc:"Streamlined DFØs hour registration for University of Oslo employees through participatory design with 15 users, cutting the process from 7 steps to 2 and reducing task time by 87%. Graded A.",          pills:[{text:"↓ 87% task time",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"2 12 6 7 10 9 14 4\"/><\/svg>"},{text:"100% rated it easier",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"8 2 10 6 14 6.5 11 9.5 11.5 14 8 12 4.5 14 5 9.5 2 6.5 6 6\"/><\/svg>"},{text:"70% → 100% success",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"2 8 6 12 14 4\"/><\/svg>"}],  color:"#9f7ac4", image:"CardCover/DFØCover.png"},
  { blank: true, color: "#d4d0cb" }
];

const N = projects.length;
const tilts = Array.from({length:N}, ()=>({x:0,y:0}));

// Computed card dimensions — set once then updated on resize
let CW, CH, S;

function computeDimensions() {
  const sH = (window.innerHeight * FILL) / NATIVE_H;
  const sW = (window.innerWidth * 0.92) / NATIVE_W;
  S  = Math.min(sH, sW);
  CW = Math.round(NATIVE_W * S);
  CH = Math.round(NATIVE_H * S);
  document.getElementById('infoPanel').style.maxWidth = CW + 'px';
}

// ── Spring ────────────────────────────────────────────────────────
const KS=160, DS=24, MS=1;
let pos=0, vel=0, target=0;
let raf=null, lastTs=null;

function springStep(x,v,t,dt){
  const a=(-KS*(x-t)-DS*v)/MS;
  return [x+((v+(a*dt))*dt), v+(a*dt)];
}
function tick(ts){
  if(!lastTs) lastTs=ts;
  const dt=Math.min((ts-lastTs)/1000,0.05); lastTs=ts;
  [pos,vel]=springStep(pos,vel,target,dt);
  draw();
  if(Math.abs(pos-target)<0.0008 && Math.abs(vel)<0.001){
    pos=target; vel=0; draw(); raf=null; lastTs=null;
  } else {
    raf=requestAnimationFrame(tick);
  }
}
function kick(){ if(!raf){ lastTs=null; raf=requestAnimationFrame(tick); } }

// ── Snap ──────────────────────────────────────────────────────────
const SNAP_PAUSE=700, SNAP_THRESH=0.22, DELTA_SCALE=0.004;
let scrollAccum=0, snapLocked=false, snapTimer=null;
const snapBarWrap = document.getElementById('snapBarWrap');
const snapBarFill = document.getElementById('snapBarFill');

function lockSnap(){
  snapLocked=true; scrollAccum=0;
  snapBarWrap.classList.add('visible');
  snapBarFill.style.transition=`width ${SNAP_PAUSE}ms linear`;
  snapBarFill.style.width='100%';
  clearTimeout(snapTimer);
  snapTimer=setTimeout(()=>{
    snapLocked=false; scrollAccum=0;
    snapBarFill.style.transition='width 0.08s ease';
    snapBarFill.style.width='0%';
    snapBarWrap.classList.remove('visible');
  }, SNAP_PAUSE);
}

function handleDelta(delta){
  if(snapLocked) return;
  if(document.getElementById('caseOverlay').classList.contains('open')) return;
  scrollAccum += delta * DELTA_SCALE;
  if(Math.abs(scrollAccum) >= SNAP_THRESH){
    const dir  = scrollAccum > 0 ? 1 : -1;
    const next = Math.round(target) + dir;
    if(next >= 0 && next < N){ goTo(next); lockSnap(); }
    else scrollAccum = 0;
  }
}

// ── Geometry ──────────────────────────────────────────────────────
function slotOf(offset){
  const a   = Math.abs(offset);
  const gap = CW * 0.72;
  return {
    x:       offset * gap,
    y:       a * a * 10,
    rot:     offset * 4,
    scale:   1 - a * 0.11,
    opacity: a > 2.3 ? 0 : 1 - Math.max(0, a - 0.5) * 0.46,
    zIndex:  Math.round(10 - a * 3),
  };
}

      if (c.copy) a.addEventListener('click', e => {

  // 3D tilt on hover — first and last card

  card.addEventListener('mouseenter', () => {

  card.addEventListener('mouseleave', () => cursorLabel.classList.remove('visible'));

  card.addEventListener('click', () => {

    }
    else if(i === 4){

      _overlay.classList.remove('loaded');
      img.src = 'CaseStudy/TelenorCase.png';
      openOverlay();
    }
    else if(i === 5){
      const img = document.getElementById('caseImg');
      _overlay.classList.remove('loaded');
      img.src = 'CaseStudy/NabostylistenCase.png';
      openOverlay();

      const img = document.getElementById('caseImg');
      _overlay.classList.remove('loaded');
      img.src = 'CaseStudy/DFØCase.png';
      openOverlay();

  });
  arcTrack.insertBefore(card, snapBarWrap);
  return card;
});

function draw(){
  cardEls.forEach((card, i) => {
    const {x, y, rot, scale, opacity, zIndex} = slotOf(i - pos);
    const t = tilts[i]||{x:0,y:0};
    card.style.transform  = `perspective(900px) translateX(${x}px) translateY(${y}px) rotate(${rot}deg) scale(${scale}) rotateX(${t.x}deg) rotateY(${t.y}deg)`;
    card.style.opacity    = opacity;
    card.style.zIndex     = zIndex;
    const d = Math.abs(i - pos);
    card.style.boxShadow  = d < 0.7 ? `0 20px 60px rgba(26,23,20,${(0.015*(1-d*1.3)).toFixed(3)})` : 'none';
  });

  updateInfo(Math.max(0, Math.min(N-1, Math.round(pos))));

  const ci = Math.max(0, Math.min(N-1, Math.round(pos)));
  dotEls.forEach((d, i) => d.classList.toggle('active', i === ci));
  document.getElementById('btnPrev').disabled = target <= 0;
  document.getElementById('btnNext').disabled = target >= N-1;
}

function goTo(i){ target = Math.max(0, Math.min(N-1, i)); kick(); }

let lastTx = 0, lastTy = 0;
window.addEventListener('touchstart', e => {
  lastTx = e.touches[0].clientX;
  lastTy = e.touches[0].clientY;
}, { passive:true });
window.addEventListener('touchmove', e => {
  if(_overlay.classList.contains('open')) return;
  const dx = lastTx - e.touches[0].clientX;
  const dy = lastTy - e.touches[0].clientY;
  lastTx = e.touches[0].clientX;
  lastTy = e.touches[0].clientY;
  // Use whichever axis has more movement
  const delta = Math.abs(dx) > Math.abs(dy) ? dx : dy;
  e.preventDefault();
  handleDelta(delta / DELTA_SCALE * 0.003);
}, { passive:false });

// ── Liquid Glass cursor (Chrome only) ─────────────────────────────
(function() {
  const W = 220, H = 44, R = H / 2;
  const BEZEL = Math.round(H * 0.43); // ~19px
  const N2 = 1.5;
  const clamp = v => Math.max(0, Math.min(255, Math.round(v)));

  // Convex squircle surface function
  const sf = t => Math.pow(1 - Math.pow(1 - t, 4), 0.25);

  // Pre-compute refraction displacement magnitudes via Snell's law
  const mags = [];
  for (let s = 0; s <= 256; s++) {
    const t = s / 256, dt = 0.001;
    const deriv = (sf(Math.min(1, t + dt)) - sf(Math.max(0, t - dt))) / (2 * dt);
    const sinI = Math.min(0.999, Math.abs(deriv) / Math.hypot(1, deriv));
    mags.push(Math.sign(deriv) * (sinI / N2 - sinI));
  }
  const maxM = Math.max(...mags.map(Math.abs)) || 1;

  // Capsule signed distance function
  function sdf(x, y) {
    const ax = Math.max(0, Math.abs(x - W / 2) - (W / 2 - R));
    return Math.hypot(ax, y - H / 2) - R;
  }

  // Displacement map
  const dc = document.createElement('canvas');
  dc.width = W; dc.height = H;
  const dctx = dc.getContext('2d');
  const di = dctx.createImageData(W, H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const d = sdf(x, y);
      if (d >= 0 || -d > BEZEL) { di.data[i] = di.data[i+1] = di.data[i+2] = 128; di.data[i+3] = 255; continue; }
      const t = -d / BEZEL;
      const mag = mags[Math.min(256, Math.round(t * 256))];
      const e = 0.5;
      let gx = sdf(x + e, y) - sdf(x - e, y);
      let gy = sdf(x, y + e) - sdf(x, y - e);
      const gl = Math.hypot(gx, gy) || 1;
      gx /= gl; gy /= gl;
      const dispPx = (mag / maxM) * BEZEL;
      di.data[i]   = clamp(128 + gx * dispPx * 127 / BEZEL);
      di.data[i+1] = clamp(128 + gy * dispPx * 127 / BEZEL);
      di.data[i+2] = 128; di.data[i+3] = 255;
    }
  }
  dctx.putImageData(di, 0, 0);
  const dispUrl = dc.toDataURL();

  // Specular highlight map (rim light from top-left)
  const sc = document.createElement('canvas');
  sc.width = W; sc.height = H;
  const sctx = sc.getContext('2d');
  const si = sctx.createImageData(W, H);
  const LX = -0.5, LY = -0.87, LL = Math.hypot(LX, LY);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const d = sdf(x, y);
      if (d >= 0 || -d > BEZEL) { si.data[i+3] = 0; continue; }
      const t = -d / BEZEL;
      const e = 0.5;
      let nx = sdf(x + e, y) - sdf(x - e, y);
      let ny = sdf(x, y + e) - sdf(x, y - e);
      const nl = Math.hypot(nx, ny) || 1;
      nx /= nl; ny /= nl;
      const dot = Math.max(0, -(nx * LX / LL + ny * LY / LL));
      const falloff = Math.pow(1 - t, 0.35);
      const v = clamp(dot * falloff * 255);
      si.data[i] = si.data[i+1] = si.data[i+2] = v;
      si.data[i+3] = clamp(dot * falloff * 190);
    }
  }
  sctx.putImageData(si, 0, 0);
  const specUrl = sc.toDataURL();

  // Build SVG filter
  const SCALE = BEZEL * 2;
  const svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svgEl.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;pointer-events:none';
  svgEl.innerHTML = `<defs>
    <filter id="liquidGlass" filterUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}" color-interpolation-filters="sRGB">
      <feImage href="${dispUrl}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="none" result="disp"/>
      <feDisplacementMap in="SourceGraphic" in2="disp" scale="${SCALE}" xChannelSelector="R" yChannelSelector="G" result="refracted"/>
      <feImage href="${specUrl}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="none" result="spec"/>
      <feBlend in="refracted" in2="spec" mode="screen"/>
    </filter>
  </defs>`;
  document.body.appendChild(svgEl);

  // Apply to cursor label
  const lbl = document.getElementById('cursorLabel');
  lbl.style.background = 'rgba(255,255,255,0.04)';
  lbl.style.backdropFilter = 'url(#liquidGlass)';
  lbl.style.webkitBackdropFilter = 'url(#liquidGlass)';
  lbl.style.border = '1px solid rgba(255,255,255,0.5)';
  lbl.style.boxShadow = '0 2px 20px rgba(0,0,0,0.07), inset 0 0.5px 0 rgba(255,255,255,0.9)';
  lbl.style.color = '#1d1d1f';
  lbl.style.textShadow = '0 1px 2px rgba(255,255,255,0.5)';
})();
