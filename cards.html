<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #f0f0f0;
    color: #2B2828;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    gap: 0;
  }

  .arc-track {
    position: relative;
    width: 100%;
    flex-shrink: 0;
  }

  .card {
    position: absolute;
    border-radius: 16px;
    border: none;
    overflow: hidden;
    cursor: pointer;
    will-change: transform, opacity;
    left: 50%;
    top: 0;
  }
  .card-swatch { position: absolute; inset: 0; }

  .card-index { display: none; }

  .info-panel {
    width: 100%;
    max-width: 100%;
    padding: 0 32px;
    height: 220px;
    overflow: visible;
    text-align: left;
    flex-shrink: 0;
  }

  @keyframes fadeUp {
    from { opacity:0; }
    to   { opacity:1; }
  }

  .info-eyebrow {
    display: none;
  }
  .info-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 2.4rem; font-weight: 400; line-height: 1.05;
    color: #2B2828;
  }
  .info-desc {
    font-size: 0.86rem; line-height: 1.75;
    color: #696767; font-weight: 300; margin-bottom: 18px;
  }
  .info-pills { display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-start; }
  .pill {
    font-size: 11px; padding: 4px 12px; border-radius: 100px;
    border: none; color: #696767; background: rgba(255,255,255,0.45);
    display:inline-flex; align-items:center; gap:5px;
  }
  .pill svg { flex-shrink:0; opacity:0.75; }
  .pill.hi { border: none; color: #2B2828; background: rgba(255,255,255,0.55); }

  .nav-dots {
    display:flex; gap:7px; justify-content:center;
    margin-top:24px; align-items:center;
  }
  .dot {
    width:5px; height:5px; border-radius:50%;
    background:#E5E4E2; cursor:pointer;
    transition: width 0.4s cubic-bezier(0.34,1.3,0.64,1), background 0.3s, border-radius 0.4s;
  }
  .dot.active { width:20px; border-radius:3px; background:#2B2828; }

  .arrows { display:none; gap:10px; margin-top:18px; }
  .arrow-btn {
    width:38px; height:38px; border-radius:50%;
    border:1px solid #E5E4E2;
    background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:#2B2828;
    transition:background 0.2s, border-color 0.2s, opacity 0.25s;
  }
  .arrow-btn:hover { background:rgba(43,40,40,0.05); border-color:#BCBAB8; }
  .arrow-btn:disabled { opacity:0.2; cursor:default; }

  .snap-bar-wrap { display:none; }

  /* ── CURSOR LABEL ── */
  #cursorLabel {
    position: fixed; z-index: 9999;
    pointer-events: none;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #1d1d1f;
    border: 1px solid rgba(0,0,0,0.08);
    font-family: 'DM Sans', sans-serif;
    font-size: 11.5px;
    font-weight: 400;
    letter-spacing: 0.02em;
    padding: 6px 14px;
    border-radius: 100px;
    opacity: 0;
    transform: translate(-50%, 28px) scale(0.75);
    transition: opacity 0.18s ease, transform 0.2s cubic-bezier(0.22,1,0.36,1);
    white-space: nowrap;
  }
  #cursorLabel.visible {
    opacity: 1;
    transform: translate(-50%, 28px) scale(1);
  }

  /* ── PAGE TRANSITION ── */
  @keyframes fadeOutUp {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-18px); }
  }
  body.leaving { animation: fadeOutUp 0.35s cubic-bezier(0.4,0,1,1) forwards; pointer-events: none; }

  /* ── INTRO ANIMATIONS ── */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateX(-50%) translateY(-24px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  @keyframes fadeUpScale {
    from { opacity: 0; transform: translateY(40px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .top-gradient {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 180px;
    background: linear-gradient(#f0f0f0 5%, transparent 100%);
    pointer-events: none;
    z-index: 50;
  }
  .watermark {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Homemade Apple', cursive;
    font-size: 0.78rem;
    color: rgba(43,40,40,0.3);
    white-space: nowrap;
    pointer-events: none;
    z-index: 10;
  }
  .site-nav   { opacity: 0; }
  .nav-dots   { opacity: 0; }
  #arcTrack   { opacity: 0; }
  #infoPanel  { opacity: 0; }

  .site-nav.intro-done   { animation: fadeDown     2.2s  cubic-bezier(0.22,1,0.36,1) 0.4s  forwards; }
  #arcTrack.intro-done   { animation: fadeUpScale  2.6s  cubic-bezier(0.22,1,0.36,1) 0.0s  forwards; }
  .nav-dots.intro-done   { animation: fadeUp       2.0s  cubic-bezier(0.22,1,0.36,1) 0.8s  forwards; }
  #infoPanel.intro-done  { animation: fadeUp       2.0s  cubic-bezier(0.22,1,0.36,1) 1.0s  forwards; }


  /* ── NAV ── */
  .site-nav {
    position: fixed;
    top: max(24px, env(safe-area-inset-top, 0px) + 12px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    z-index: 100;
    white-space: nowrap;
  }
  .site-nav a {
    text-decoration: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #999999;
    transition: opacity 0.2s;
  }
  .site-nav a:hover { opacity: 0.6; }
  .site-nav a.active { font-weight: 500; }

  /* ── STAGE ── */
  .stage {
    padding-top: max(72px, env(safe-area-inset-top, 0px) + 64px);
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  }

  /* ── RESPONSIVE SPACER ── */
  .card-info-gap { height: 28px; flex-shrink: 0; }

  @media (max-width: 430px) {
    .site-nav { padding: 4px; }
    .site-nav a { padding: 5px 14px; }
    .info-title  { font-size: 1.8rem; }
    .info-desc   { font-size: 0.82rem; line-height: 1.55; margin-bottom: 14px; }
    .info-text   { font-size: 0.95rem !important; }
    .info-panel  { height: 220px; padding: 0 16px; overflow: visible; }
    .pill        { font-size: 10px; padding: 3px 9px; }
    .watermark   { display: none; }
    .nav-dots    { margin-top: 14px; }
    .arrows      { margin-top: 10px; }
    .card-info-gap { height: 18px; }
  }

  @media (max-width: 360px) {
    .info-title { font-size: 1.55rem; }
    .info-desc  { display: none; }
    .info-text  { font-size: 0.85rem !important; }
    .info-panel { height: 150px; overflow: visible; }
    .card-info-gap { height: 12px; }
  }

  @media (max-height: 650px) and (orientation: portrait) {
    .info-desc  { font-size: 0.80rem; line-height: 1.5; }
    .info-panel { height: 185px; }
    .nav-dots   { margin-top: 10px; }
    .arrows     { margin-top: 8px; }
    .card-info-gap { height: 16px; }
  }

  @media (max-height: 500px) and (orientation: landscape) {
    .site-nav, .info-panel, .nav-dots, .arrows { display: none !important; }
    .stage { justify-content: center; padding: 0; }
  }

  /* ── CASE STUDY LIGHTBOX ── */
  @keyframes overlayIn  { from { opacity:0; } to { opacity:1; } }
  @keyframes overlayOut { from { opacity:1; } to { opacity:0; } }
  @keyframes imgSlideIn { from { opacity:0; transform:translateY(32px) scale(0.97); } to { opacity:1; transform:translateY(0) scale(1); } }
  @keyframes imgSlideOut{ from { opacity:1; transform:translateY(0) scale(1); } to { opacity:0; transform:translateY(24px) scale(0.97); } }

  #caseOverlay {
    display: flex;
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    overflow-y: auto;
    overscroll-behavior: none;
    cursor: zoom-out;
    opacity: 0;
    pointer-events: none;
    align-items: flex-start;
    justify-content: center;
  }
  #caseOverlay.open    { animation: overlayIn  1.4s cubic-bezier(0.22,1,0.36,1) forwards; pointer-events: auto; }
  #caseOverlay.closing { animation: overlayOut 0.28s cubic-bezier(0.4,0,1,1) forwards; pointer-events: none; }
  #caseOverlay.open #caseImg    { animation: imgSlideIn  1.8s cubic-bezier(0.22,1,0.36,1) 0.2s both; }
  #caseOverlay.closing #caseImg { animation: imgSlideOut 0.28s cubic-bezier(0.4,0,1,1) forwards; }
  #caseOverlay img {
    width: 100%;
    max-width: 1400px;
    display: block;
    margin: 80px auto 40px;
    border-radius: 12px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    cursor: default;
  }
  #caseClose {
    display: none;
    position: fixed; top: 24px; right: 24px;
    z-index: 1100;
    color: #fff; font-size: 22px;
    cursor: pointer;
    transition: opacity 0.2s;
    background: none;
    border: none;
    padding: 0;
    opacity: 0.7;
  }
  #caseClose:hover { opacity: 1; }
  #caseTopBtn {
    position: fixed; bottom: 28px; right: 24px;
    z-index: 1100;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff; font-size: 16px; line-height: 36px; text-align: center;
    cursor: pointer; backdrop-filter: blur(8px);
    transition: background 0.15s, opacity 0.2s;
    opacity: 0; pointer-events: none;
  }
  #caseTopBtn.visible { opacity: 1; pointer-events: auto; }
  #caseTopBtn:hover { background: rgba(255,255,255,0.28); }
  #caseSpinner {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 36px; height: 36px;
    border: 2.5px solid rgba(255,255,255,0.2);
    border-top-color: rgba(255,255,255,0.85);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  #caseOverlay.loaded #caseSpinner { display: none; }
  #caseOverlay:not(.loaded) #caseImg { opacity: 0; }

  /* ── GRID VIEW ── */
  #gridBtnWrap {
    position: fixed;
    right:  max(24px, env(safe-area-inset-right, 0px) + 16px);
    bottom: max(24px, env(safe-area-inset-bottom, 0px) + 16px);
    z-index: 100;
    opacity: 0;
  }
  #gridBtnWrap.intro-done { animation: fadeUp 2.0s cubic-bezier(0.22,1,0.36,1) 1.2s forwards; }
  #gridBtn {
    position: relative;
    width: 42px; height: 42px;
    border: none;
    background: none;
    color: #999999;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.3s cubic-bezier(0.22,1,0.36,1), color 0.2s;
  }
  #gridBtn:hover  { transform: scale(1.08); color: #2B2828; }
  #gridBtn:active { transform: scale(0.94); }
  #gridBtn svg {
    position: absolute;
    transition: opacity 0.3s ease, transform 0.45s cubic-bezier(0.22,1,0.36,1);
  }
  #gridBtn .ic-carousel { opacity: 0; transform: rotate(-90deg) scale(0.6); }
  body.grid-mode #gridBtn .ic-grid     { opacity: 0; transform: rotate(90deg) scale(0.6); }
  body.grid-mode #gridBtn .ic-carousel { opacity: 1; transform: none; }

  #infoPanel, .nav-dots, .top-gradient, .watermark { transition: opacity 0.45s ease; }
  body.grid-mode #infoPanel,
  body.grid-mode .nav-dots,
  body.grid-mode .top-gradient,
  body.grid-mode .watermark { opacity: 0 !important; pointer-events: none; }

  @media (max-height: 500px) and (orientation: landscape) { #gridBtnWrap { display: none; } }

  @keyframes hintPulse { 0%, 100% { color: #BCBAB8; } 45% { color: #6f6c6b; } }
  .scroll-hint.nudge { animation: hintPulse 1.2s ease-in-out; }

  #focusBackdrop {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(22,20,19,0.58);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none;
    cursor: zoom-out;
  }
</style>
</head>

const projects = [
  { title:"Bloom Health",    role:"Mobile App · 2024",  desc:"Redesigned core tracking flows to reduce cognitive load, introducing ambient check-ins that fit naturally into daily routines.",                         pills:[{text:"↑ 38% retention",hi:true,icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"2 12 6 7 10 9 14 4\"/><\/svg>"},{text:"4.8 ★",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"8 2 10 6 14 6.5 11 9.5 11.5 14 8 12 4.5 14 5 9.5 2 6.5 6 6\"/><\/svg>"},{text:"iOS & Android",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4.5\" y=\"1\" width=\"7\" height=\"14\" rx=\"2\"/><line x1=\"7\" y1=\"12\" x2=\"9\" y2=\"12\"/><\/svg>"}],          color:"#c8a882", image:"CardCover/Card.png" },

const N = projects.length;
const tilts = Array.from({length:N}, ()=>({x:0,y:0}));

// Computed card dimensions — set once then updated on resize
let CW, CH, S;

function computeDimensions() {
  const sH = (window.innerHeight * FILL) / NATIVE_H;
  const sW = (window.innerWidth * 0.92) / NATIVE_W;
  S  = Math.min(sH, sW);
  CW = Math.round(NATIVE_W * S);
  CH = Math.round(NATIVE_H * S);
  document.getElementById('infoPanel').style.maxWidth = CW + 'px';
}

// ── Spring ────────────────────────────────────────────────────────
const KS=160, DS=24, MS=1;
let pos=0, vel=0, target=0;
let raf=null, lastTs=null;
let firstDraw = true;

function springStep(x,v,t,dt){
  const a=(-KS*(x-t)-DS*v)/MS;
  return [x+((v+(a*dt))*dt), v+(a*dt)];
}
// Grid view morph: 0 = carousel, 1 = grid. Slightly under-damped for a soft settle.
const GK=70, GD=16;
let gridMode=false, gridT=0, gridV=0, gridTarget=0;
// Focus overlay: the intro and contact cards lift out of the grid to centre.
const FK=90, FD=19;
let focusIdx=null, focusT=0, focusV=0, focusTarget=0;
// Idle nudge on the first card: a small peek toward the next card plus a label pulse.
const HOVER_ZOOM = 0.22;   // grid-view hover growth
const NUDGE_FIRST = 6000, NUDGE_REPEAT = 7000, NUDGE_MAX = 3, NUDGE_PEEK = 0.09;
let nudgeTimer = null, nudgeCount = 0;

function tick(ts){
  if(!lastTs) lastTs=ts;
  const dt=Math.min((ts-lastTs)/1000,0.05); lastTs=ts;
  [pos,vel]=springStep(pos,vel,target,dt);
  gridV += (-GK*(gridT-gridTarget) - GD*gridV)*dt;
  gridT += gridV*dt;
  focusV += (-FK*(focusT-focusTarget) - FD*focusV)*dt;
  focusT += focusV*dt;
  let hoverDone = true;
  for(const c of cardEls){
    if(c.hoverT === c.hoverTarget) continue;
    c.hoverT += (c.hoverTarget - c.hoverT) * Math.min(1, dt * 11);
    if(Math.abs(c.hoverTarget - c.hoverT) < 0.001) c.hoverT = c.hoverTarget;
    else hoverDone = false;
  }
  draw();
  const posDone   = Math.abs(pos-target)<0.0008 && Math.abs(vel)<0.001;
  const gridDone  = Math.abs(gridT-gridTarget)<0.0008 && Math.abs(gridV)<0.001;
  const focusDone = Math.abs(focusT-focusTarget)<0.0008 && Math.abs(focusV)<0.001;
  if(posDone && gridDone && focusDone && hoverDone){
    pos=target; vel=0; gridT=gridTarget; gridV=0; focusT=focusTarget; focusV=0;
    if(focusTarget===0) focusIdx=null;
    draw(); raf=null; lastTs=null;
  } else {
    raf=requestAnimationFrame(tick);
  }
}
function kick(){ if(!raf){ lastTs=null; raf=requestAnimationFrame(tick); } }

// ── Snap ──────────────────────────────────────────────────────────
const SNAP_PAUSE=700, SNAP_THRESH=0.22, DELTA_SCALE=0.004;
let scrollAccum=0, snapLocked=false, snapTimer=null;
const snapBarWrap = document.getElementById('snapBarWrap');
const snapBarFill = document.getElementById('snapBarFill');

function lockSnap(){
  snapLocked=true; scrollAccum=0;
  snapBarWrap.classList.add('visible');
  snapBarFill.style.transition=`width ${SNAP_PAUSE}ms linear`;
  snapBarFill.style.width='100%';
  clearTimeout(snapTimer);
  snapTimer=setTimeout(()=>{
    snapLocked=false; scrollAccum=0;
    snapBarFill.style.transition='width 0.08s ease';
    snapBarFill.style.width='0%';
    snapBarWrap.classList.remove('visible');
  }, SNAP_PAUSE);
}

function handleDelta(delta){
  if(snapLocked || gridMode) return;
  if(document.getElementById('caseOverlay').classList.contains('open')) return;
  scrollAccum += delta * DELTA_SCALE;
  if(Math.abs(scrollAccum) >= SNAP_THRESH){
    const dir  = scrollAccum > 0 ? 1 : -1;
    const next = Math.round(target) + dir;
    if(next >= 0 && next < N){ goTo(next); lockSnap(); }
    else scrollAccum = 0;
  }
}

// ── Geometry ──────────────────────────────────────────────────────
function slotOf(offset){
  const a   = Math.abs(offset);
  const gap = CW * 0.72;
  const yScale = window.innerWidth < 768 ? 3 : 10;
  return {
    x:       offset * gap,
    y:       a * a * yScale,
    rot:     offset * 4,
    scale:   1 - a * 0.11,
    opacity: a > 2.3 ? 0 : 1 - Math.max(0, a - 0.5) * 0.46,
    zIndex:  Math.round(10 - a * 3),
  };
}

// Attaches the frosted-glass + glare machinery to a card. `base` is how the card
// already looks outside the focus overlay, so every value lerps back to it at k=0.
function addGlass(card, swatch, base){
  const glare = document.createElement('div');
  glare.style.cssText = 'position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity 0.35s ease; will-change:opacity;';
  card.glareEl = glare;
  card.swatchEl = swatch;
  card.glassBase = base;
  card.userDriving = false;
}

// Grid geometry. Cards keep their carousel box (left:50%, top:0 in the arc
// track); the grid is reached purely through translate/scale, so no layout changes.
const lerp = (a, b, t) => a + (b - a) * t;
function gridLayout(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const gap    = Math.max(10, Math.round(vw * 0.008));
  const topPad = 76, botPad = 72;
  const side   = Math.max(16, Math.round(vw * 0.02));
  const boxW = vw - 2 * side, boxH = vh - topPad - botPad;
  // The best column count depends on viewport aspect, not width alone: pick
  // whichever fits the whole set on screen at the largest tile size.
  let cols = 2, gs = 0;
  for (let c = 2; c <= Math.min(5, N); c++) {
    const r = Math.ceil(N / c);
    const s = Math.min((boxW - (c-1)*gap) / (c*CW), (boxH - (r-1)*gap) / (r*CH), 1);
    if (s > gs) { gs = s; cols = c; }
  }
  const rows = Math.ceil(N / cols);
  const tw = CW * gs, th = CH * gs;
  const gridH   = rows * th + (rows - 1) * gap;
  const gridTop = topPad + (boxH - gridH) / 2;
  // An edge tile grows outward by half the zoom, so cap it at the slack around the grid.
  const freeX = (vw - (cols * tw + (cols - 1) * gap)) / 2;
  const zoom  = Math.min(HOVER_ZOOM, 2 * freeX / tw, 2 * gridTop / th);
  return { cols, gap, gs, tw, th, gridTop, zoom, arcTop: arcTrack.offsetTop };
}
function gridSlotOf(i, L){
  const col = i % L.cols, row = Math.floor(i / L.cols);
  return {
    x: (col - (L.cols - 1) / 2) * (L.tw + L.gap),
    y: L.gridTop + row * (L.th + L.gap) + L.th / 2 - L.arcTop - CH / 2,
    scale: L.gs,
  };
}
function focusSlot(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const pad = Math.max(24, Math.round(Math.min(vw, vh) * 0.07));
  return {
    x: 0,
    y: vh / 2 - arcTrack.offsetTop - CH / 2,
    scale: Math.min((vw - 2*pad) / CW, (vh - 2*pad) / CH, 1),
  };
}
// Nudge: when the intro card opens, one light sweep crosses the glass with a small
// tilt rock, then the sheen drifts slowly until the pointer actually moves over it.
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const easeInOut = x => x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2) / 2;
let glareRaf = null, glareT0 = 0, glareCard = null;
function glareLoop(ts){
  const card = glareCard;
  if (!card || focusTarget !== 1 || focusIdx === null || cardEls[focusIdx] !== card) {
    if (card) card.glareAuto = null;
    glareCard = null; glareRaf = null; return;
  }
  if (!card.userDriving) {
    const t = (ts - glareT0) / 1000;
    const S0 = 0.3, SD = 1.4;                       // sweep starts after the lift, lasts 1.4s
    let mx, my, strength, rock;
    if (t < S0 + SD) {
      const e = easeInOut(Math.max(0, Math.min(1, (t - S0) / SD)));
      mx = -0.6 + 1.2 * e; my = -0.3 + 0.6 * e;
      strength = t < S0 ? 0 : 0.3 + 0.7 * Math.sin(Math.PI * e);
      rock = 0.6;
    } else {
      const u = t - S0 - SD, w = easeInOut(Math.min(1, u / 0.9));   // blend sweep end into drift
      const dx = 0.35 * Math.sin(u * 0.9), dy = 0.25 * Math.sin(u * 0.7 + 1.3);
      mx = lerp(0.6, dx, w); my = lerp(0.3, dy, w);
      strength = lerp(0.3, 0.22 + 0.08 * Math.sin(u * 0.5), w);
      rock = lerp(0.6, 0.35, w);
    }
    card.glareAuto = { mx, my, strength };
    tilts[focusIdx] = { x: -my * 10 * rock, y: mx * 14 * rock };
    draw();
  }
  glareRaf = requestAnimationFrame(glareLoop);
}
function setFocus(i){
  // The intro animation's forwards fill leaves a transform on #arcTrack, which makes
  // it a stacking context and traps every card's z-index below the backdrop. Settling
  // it to the identity it already ended on lets the focused card rise above.
  arcTrack.style.animation = 'none';
  arcTrack.style.opacity   = '1';
  arcTrack.style.transform = 'none';
  focusIdx = i; focusTarget = 1;
  cursorLabel.classList.remove('visible');
  if (!reducedMotion && cardEls[i].glareEl) {
    glareCard = cardEls[i];
    glareCard.userDriving = false;
    glareT0 = performance.now();
    if (!glareRaf) glareRaf = requestAnimationFrame(glareLoop);
  }
  kick();
}
function clearFocus(){
  if (focusIdx !== null) tilts[focusIdx] = {x:0, y:0};
  focusTarget = 0;
  kick();
}
function setGrid(on){
  gridMode = on;
  gridTarget = on ? 1 : 0;
  focusTarget = 0; focusT = 0; focusV = 0; focusIdx = null;
  cardEls.forEach(c => { c.hoverTarget = 0; });
  // A card hovered at the moment of toggling would keep its tilt frozen in the grid.
  for (let k = 0; k < N; k++) tilts[k] = {x:0, y:0};
  document.body.classList.toggle('grid-mode', on);
  const b = document.getElementById('gridBtn');
  b.setAttribute('aria-pressed', on);
  b.title = on ? 'Back to carousel' : 'Grid view';
  cursorLabel.classList.remove('visible');
  kick();
}

          toast.style.cssText = `position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:white;padding:16px 32px;border-radius:8px;font-size:14px;z-index:10000;pointer-events:none;`;
          toast.textContent = 'Copied!';
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 1500);
        });
      });
      contact.appendChild(a);
    });
    tilt.appendChild(contact);
  }


  // 3D tilt on hover — first and last card
  if (i === 0 || i === N - 1) {
    let tiltRaf = false;
    card.addEventListener('mousemove', e => {
      if ((gridMode && focusIdx !== i) || tiltRaf) return; tiltRaf = true;
      if (e.clientX !== card.lastPX || e.clientY !== card.lastPY) {
        card.lastPX = e.clientX; card.lastPY = e.clientY; card.userDriving = true;
      }
      requestAnimationFrame(() => {
        const r = card.getBoundingClientRect();
        const mx = (e.clientX - r.left) / r.width  - 0.5;
        const my = (e.clientY - r.top)  / r.height - 0.5;
        tilts[i] = { x: -my * 10, y: mx * 14 };
        draw();
        tiltRaf = false;
      });
    });
    card.addEventListener('mouseleave', () => {
      card.userDriving = false;
      tilts[i] = {x:0, y:0};
      draw();
    });
  }
  card.hoverT = 0; card.hoverTarget = 0;
  card.addEventListener('mouseenter', () => {
    if (gridMode && focusIdx === null) { card.hoverTarget = 1; kick(); }
    if (focusIdx !== null) return;
    if (gridMode) {
      cursorLabel.textContent = p.blank ? "Let's work together :)" : i === 0 ? 'Start' : p.title;
      cursorLabel.classList.add('visible');
    } else if (Math.abs(i - target) <= 0.4) {
      cursorLabel.textContent = p.blank ? "Let's work together :)" : i === 0 ? 'Scroll to explore' : 'Click to open';
      cursorLabel.classList.add('visible');
    }
  });
  card.addEventListener('mouseleave', () => {
    if (card.hoverTarget !== 0) { card.hoverTarget = 0; kick(); }
    cursorLabel.classList.remove('visible');
  });

  card.addEventListener('click', () => {
    cursorLabel.classList.remove('visible');
    if(gridMode){
      if(i === 0 || i === N - 1){ focusTarget === 1 && focusIdx === i ? clearFocus() : setFocus(i); return; }
      openCase(i); return;
    }
    if(Math.abs(i - target) > 0.4){ goTo(i); lockSnap(); }
    else openCase(i);
  });
  arcTrack.insertBefore(card, snapBarWrap);
  return card;
});

function draw(){
  const L = gridT > 0.0005 ? gridLayout() : null;
  cardEls.forEach((card, i) => {
    let {x, y, rot, scale, opacity, zIndex} = slotOf(i - pos);
    if (L) {
      const g = gridSlotOf(i, L), k = gridT;
      x = lerp(x, g.x, k); y = lerp(y, g.y, k); rot = lerp(rot, 0, k);
      scale = lerp(scale, g.scale, k); opacity = lerp(opacity, 1, k);
      if (k > 0.5) zIndex = 1;
    }
    if (focusT > 0.0005 && i === focusIdx) {
      const f = focusSlot(), k = Math.min(1, focusT);
      x = lerp(x, f.x, k); y = lerp(y, f.y, k); rot = lerp(rot, 0, k);
      scale = lerp(scale, f.scale, k); opacity = 1; zIndex = 600;
    }
    const hv = card.hoverT * gridT;
    if (hv > 0.001 && i !== focusIdx && L) { scale *= 1 + L.zoom * hv; zIndex = 2; }
    const t = tilts[i]||{x:0,y:0};
    card.style.transform  = `perspective(900px) translateX(${x}px) translateY(${y}px) rotate(${rot}deg) scale(${scale}) rotateX(${t.x}deg) rotateY(${t.y}deg)`;
    card.style.opacity    = opacity;
    card.style.zIndex     = zIndex;
    const d = Math.abs(i - pos);
    card.style.boxShadow  = (L && gridT > 0.5) ? 'none'
                          : d < 0.7 ? `0 20px 60px rgba(26,23,20,${(0.015*(1-d*1.3)).toFixed(3)})` : 'none';

    if (card.glareEl) {
      const k = i === focusIdx ? Math.min(1, Math.max(0, focusT)) : 0;
      const b = card.glassBase;
      card.swatchEl.style.opacity = lerp(1, 0.78, k);
      const bl = lerp(b.blur, 22, k);
      const blur = bl < 0.05 ? 'none' : `blur(${bl.toFixed(1)}px)`;
      card.style.backdropFilter = blur; card.style.webkitBackdropFilter = blur;
      card.style.background = `rgba(255,255,255,${lerp(b.bg, 0.16, k).toFixed(3)})`;
      if (b.hasBorder) card.style.border = `1px solid rgba(255,255,255,${lerp(b.bd, 0.6, k).toFixed(2)})`;
      let mx, my, strength;
      if (!card.userDriving && card.glareAuto) {
        ({ mx, my, strength } = card.glareAuto);
      } else {
        // Tilt encodes the pointer offset (x = -my*10, y = mx*14); recover it to place the highlight.
        mx = t.y / 14; my = -t.x / 10;
        const mag = Math.min(1, Math.hypot(mx, my) * 2.2);
        strength = card.userDriving ? 0.35 + 0.65 * mag : 0.12;
      }
      const gx = 50 + mx * 100, gy = 50 + my * 100;
      const ang = 105 + my * 50, band = 50 + mx * 55;
      // Slow fade when the pointer leaves; quick tracking while the sweep/drift animates.
      card.glareEl.style.transitionDuration = card.userDriving ? '0.35s' : '0.12s';
      card.glareEl.style.opacity = k * strength;
      if (k > 0) card.glareEl.style.background =
        `radial-gradient(circle at ${gx.toFixed(1)}% ${gy.toFixed(1)}%, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.12) 28%, rgba(255,255,255,0) 62%), ` +
        `linear-gradient(${ang.toFixed(1)}deg, rgba(255,255,255,0) ${(band-18).toFixed(1)}%, rgba(255,255,255,0.22) ${band.toFixed(1)}%, rgba(255,255,255,0) ${(band+18).toFixed(1)}%)`;
    }
    if (i === focusIdx && focusT > 0.0005) {
      const k = Math.min(1, focusT);
      const ring = (card.glassBase && !card.glassBase.hasBorder)
        ? `, inset 0 0 0 1px rgba(255,255,255,${(0.5*k).toFixed(2)})` : '';
      card.style.boxShadow = `0 ${Math.round(28*k)}px ${Math.round(90*k)}px rgba(0,0,0,${(0.38*k).toFixed(3)}), inset 0 1px 0 rgba(255,255,255,${(0.55*k).toFixed(2)})${ring}`;
    }
  });

  const fb = document.getElementById('focusBackdrop');
  fb.style.opacity = Math.max(0, Math.min(1, focusT));
  fb.style.pointerEvents = focusT > 0.02 ? 'auto' : 'none';

  updateInfo(Math.max(0, Math.min(N-1, Math.round(pos))));

  const ci = Math.max(0, Math.min(N-1, Math.round(pos)));
  dotEls.forEach((d, i) => d.classList.toggle('active', i === ci));
  document.getElementById('btnPrev').disabled = target <= 0;
  document.getElementById('btnNext').disabled = target >= N-1;

  // Control video playback and overlay. Grid view plays every card at once.
  cardEls.forEach((card, i) => {
    if (card.videoElement && card.hasVideoOverlay !== undefined) {
      if (gridMode || i === ci) {
        // Prepare video, keep image visible until video is ready
        if (!card.hasVideoOverlay) {
          card.videoElement.currentTime = 0;
          card.videoElement.style.display = 'block';
          card.hasVideoOverlay = true;
          card.onCanPlay = () => {
            card.querySelector('.card-swatch').style.backgroundImage = 'none';
            card.onCanPlay = null;
          };
          card.videoElement.addEventListener('canplay', card.onCanPlay, { once: true });
          card.videoElement.play().catch(() => {
            card.videoElement.style.display = 'none';
            card.hasVideoOverlay = false;
          });
        }
      } else {
        // Hide video, show image
        if (card.hasVideoOverlay) {
          // Drop a canplay still pending, or it would wipe the cover we just restored.
          if (card.onCanPlay) {
            card.videoElement.removeEventListener('canplay', card.onCanPlay);
            card.onCanPlay = null;
          }
          card.videoElement.style.display = 'none';
          card.querySelector('.card-swatch').style.backgroundImage = `url('${card.dataset.coverImage}')`;
          card.hasVideoOverlay = false;
          card.videoElement.pause();
        }
      }
    }
  });
  firstDraw = false;
}

// ── Liquid Glass cursor (Chrome only) ─────────────────────────────
(function() {
  const W = 220, H = 44, R = H / 2;
  const BEZEL = Math.round(H * 0.43); // ~19px
  const N2 = 1.5;
  const clamp = v => Math.max(0, Math.min(255, Math.round(v)));

  // Convex squircle surface function
  const sf = t => Math.pow(1 - Math.pow(1 - t, 4), 0.25);

  // Pre-compute refraction displacement magnitudes via Snell's law
  const mags = [];
  for (let s = 0; s <= 256; s++) {
    const t = s / 256, dt = 0.001;
    const deriv = (sf(Math.min(1, t + dt)) - sf(Math.max(0, t - dt))) / (2 * dt);
    const sinI = Math.min(0.999, Math.abs(deriv) / Math.hypot(1, deriv));
    mags.push(Math.sign(deriv) * (sinI / N2 - sinI));
  }
  const maxM = Math.max(...mags.map(Math.abs)) || 1;

  // Capsule signed distance function
  function sdf(x, y) {
    const ax = Math.max(0, Math.abs(x - W / 2) - (W / 2 - R));
    return Math.hypot(ax, y - H / 2) - R;
  }

  // Displacement map
  const dc = document.createElement('canvas');
  dc.width = W; dc.height = H;
  const dctx = dc.getContext('2d');
  const di = dctx.createImageData(W, H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const d = sdf(x, y);
      if (d >= 0 || -d > BEZEL) { di.data[i] = di.data[i+1] = di.data[i+2] = 128; di.data[i+3] = 255; continue; }
      const t = -d / BEZEL;
      const mag = mags[Math.min(256, Math.round(t * 256))];
      const e = 0.5;
      let gx = sdf(x + e, y) - sdf(x - e, y);
      let gy = sdf(x, y + e) - sdf(x, y - e);
      const gl = Math.hypot(gx, gy) || 1;
      gx /= gl; gy /= gl;
      const dispPx = (mag / maxM) * BEZEL;
      di.data[i]   = clamp(128 + gx * dispPx * 127 / BEZEL);
      di.data[i+1] = clamp(128 + gy * dispPx * 127 / BEZEL);
      di.data[i+2] = 128; di.data[i+3] = 255;
    }
  }
  dctx.putImageData(di, 0, 0);
  const dispUrl = dc.toDataURL();

  // Specular highlight map (rim light from top-left)
  const sc = document.createElement('canvas');
  sc.width = W; sc.height = H;
  const sctx = sc.getContext('2d');
  const si = sctx.createImageData(W, H);
  const LX = -0.5, LY = -0.87, LL = Math.hypot(LX, LY);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const d = sdf(x, y);
      if (d >= 0 || -d > BEZEL) { si.data[i+3] = 0; continue; }
      const t = -d / BEZEL;
      const e = 0.5;
      let nx = sdf(x + e, y) - sdf(x - e, y);
      let ny = sdf(x, y + e) - sdf(x, y - e);
      const nl = Math.hypot(nx, ny) || 1;
      nx /= nl; ny /= nl;
      const dot = Math.max(0, -(nx * LX / LL + ny * LY / LL));
      const falloff = Math.pow(1 - t, 0.35);
      const v = clamp(dot * falloff * 255);
      si.data[i] = si.data[i+1] = si.data[i+2] = v;
      si.data[i+3] = clamp(dot * falloff * 190);
    }
  }
  sctx.putImageData(si, 0, 0);
  const specUrl = sc.toDataURL();

  // Build SVG filter
  const SCALE = BEZEL * 2;
  const svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svgEl.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;pointer-events:none';
  svgEl.innerHTML = `<defs>
    <filter id="liquidGlass" filterUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}" color-interpolation-filters="sRGB">
      <feImage href="${dispUrl}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="none" result="disp"/>
      <feDisplacementMap in="SourceGraphic" in2="disp" scale="${SCALE}" xChannelSelector="R" yChannelSelector="G" result="refracted"/>
      <feImage href="${specUrl}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="none" result="spec"/>
      <feBlend in="refracted" in2="spec" mode="screen"/>
    </filter>
  </defs>`;
  document.body.appendChild(svgEl);

  // Apply to cursor label
  const lbl = document.getElementById('cursorLabel');
  lbl.style.background = 'rgba(255,255,255,0.04)';
  lbl.style.backdropFilter = 'url(#liquidGlass)';
  lbl.style.webkitBackdropFilter = 'url(#liquidGlass)';
  lbl.style.border = '1px solid rgba(255,255,255,0.5)';
  lbl.style.boxShadow = '0 2px 20px rgba(0,0,0,0.07), inset 0 0.5px 0 rgba(255,255,255,0.9)';
  lbl.style.color = '#1d1d1f';
  lbl.style.textShadow = '0 1px 2px rgba(255,255,255,0.5)';
})();

function canNudge(){
  return !gridMode && focusIdx === null && target === 0 && Math.abs(pos) < 0.01 && !raf
      && !_overlay.classList.contains('open') && document.visibilityState === 'visible';
}
function scheduleNudge(delay){
  clearTimeout(nudgeTimer); nudgeTimer = null;
  if (nudgeCount < NUDGE_MAX) nudgeTimer = setTimeout(runNudge, delay);
}
function stopNudging(){ nudgeCount = NUDGE_MAX; clearTimeout(nudgeTimer); nudgeTimer = null; }
function runNudge(){
  if (!canNudge()) { scheduleNudge(NUDGE_REPEAT); return; }
  nudgeCount++;
  const hint = infoPanel.querySelector('.scroll-hint');
  if (hint) { hint.classList.remove('nudge'); void hint.offsetWidth; hint.classList.add('nudge'); }
  if (!reducedMotion) {
    target = NUDGE_PEEK; kick();
    // Spring back unless the visitor navigated during the peek.
    setTimeout(() => { if (target === NUDGE_PEEK) { target = 0; kick(); } }, 420);
  }
  scheduleNudge(NUDGE_REPEAT);
}
// Activity pushes the next nudge back; navigation (via goTo) stops it entirely.
['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach(ev =>
  window.addEventListener(ev, () => { if (nudgeTimer) scheduleNudge(NUDGE_REPEAT); }, { passive: true }));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') scheduleNudge(NUDGE_REPEAT);
  else { clearTimeout(nudgeTimer); nudgeTimer = null; }
});

document.getElementById('focusBackdrop').addEventListener('click', clearFocus);
document.querySelector('.nav-dots').addEventListener('animationend', function(){
  this.style.animation = 'none'; this.style.opacity = '1';
}, { once: true });

// Then render after animations start
requestAnimationFrame(() => draw());

// Preload case study images in the background after page is interactive
setTimeout(() => {
  ['AltekCase','SkatteetatenCase','KronCase','TelenorCase','NabostylistenCase','DFØCase'].forEach(name => {
    const img = new Image();
    img.src = `CaseStudy/${name}.jpg`;
  });
}, 1000);

// Check for hash to open case study automatically
setTimeout(() => {
  const hash = window.location.hash;
  const caseStudies = {
    '#open-case-altek': 'AltekCase.jpg',
    '#open-case-kron': 'KronCase.png',
    '#open-case-skatteetaten': 'SkatteetatenCase.jpg',
    '#open-case-telenor': 'TelenorCase.png'
  };

  if (caseStudies[hash]) {
    const img = document.getElementById('caseImg');
    _overlay.classList.remove('loaded');
    img.src = 'CaseStudy/' + caseStudies[hash];
    openOverlay();
    window.history.replaceState({}, document.title, window.location.pathname);
  }
}, 100);

</script>
</body>
</html>
