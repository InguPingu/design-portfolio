<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #f0f0f0;
    color: #2B2828;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    gap: 0;
  }

  .arc-track {
    position: relative;
    width: 100%;
    flex-shrink: 0;
  }

  .card {
    position: absolute;
    border-radius: 16px;
    border: 1px solid rgba(26,23,20,0.09);
    overflow: hidden;
    cursor: pointer;
    will-change: transform, opacity;
    left: 50%;
    top: 0;
  }

  .card-swatch { position: absolute; inset: 0; }

  .card-index { display: none; }

  .info-panel {
    width: 100%;
    max-width: 540px;
    padding: 0 32px;
    min-height: 130px;
    text-align: center;
    flex-shrink: 0;
  }

  @keyframes fadeUp {
    from { opacity:0; }
    to   { opacity:1; }
  }

  .info-eyebrow {
    font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: #BCBAB8; margin-bottom: 10px;
  }
  .info-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 2.4rem; font-weight: 400; line-height: 1.05;
    color: #2B2828; margin-bottom: 10px;
  }
  .info-desc {
    font-size: 0.86rem; line-height: 1.75;
    color: #696767; font-weight: 300; margin-bottom: 18px;
  }
  .info-pills { display:flex; gap:7px; flex-wrap:wrap; justify-content:center; }
  .pill {
    font-size: 11px; padding: 4px 12px; border-radius: 100px;
    border: 1px solid #E5E4E2; color: #696767;
    display:inline-flex; align-items:center; gap:5px;
  }
  .pill svg { flex-shrink:0; opacity:0.75; }
  .pill.hi { border-color:#BCBAB8; color:#2B2828; background:rgba(43,40,40,0.04); }

  .nav-dots {
    display:flex; gap:7px; justify-content:center;
    margin-top:24px; align-items:center;
  }
  .dot {
    width:5px; height:5px; border-radius:50%;
    background:#E5E4E2; cursor:pointer;
    transition: width 0.4s cubic-bezier(0.34,1.3,0.64,1), background 0.3s, border-radius 0.4s;
  }
  .dot.active { width:20px; border-radius:3px; background:#2B2828; }

  .arrows { display:flex; gap:10px; margin-top:18px; }
  .arrow-btn {
    width:38px; height:38px; border-radius:50%;
    border:1px solid #E5E4E2;
    background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:#2B2828;
    transition:background 0.2s, border-color 0.2s, opacity 0.25s;
  }
  .arrow-btn:hover { background:rgba(43,40,40,0.05); border-color:#BCBAB8; }
  .arrow-btn:disabled { opacity:0.2; cursor:default; }

  .snap-bar-wrap { display:none; }

  /* ── NAV ── */
  .site-nav {
    position: fixed;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(26,23,20,0.09);
    border-radius: 100px;
    padding: 5px;
    z-index: 100;
  }
  .site-nav a {
    text-decoration: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: #2B2828;
    padding: 6px 16px;
    border-radius: 100px;
    transition: background 0.15s;
  }
  .site-nav a:hover { background: rgba(43,40,40,0.06); }
  .site-nav a.active { background: #2B2828; color: #fff; }

  @media (max-width: 600px) {
    .site-nav { top: 16px; padding: 4px; }
    .site-nav a { font-size: 12px; padding: 5px 14px; }
  }

</style>
</head>
<body>
<nav class="site-nav">
  <a href="cards.html" class="active">Projects</a>
  <a href="about.html">About</a>
</nav>

<div class="stage">
  <div class="arc-track" id="arcTrack">
    <div class="snap-bar-wrap" id="snapBarWrap">
      <div class="snap-bar-fill" id="snapBarFill"></div>
    </div>
  </div>
  <div style="height:32px;flex-shrink:0"></div>
  <div class="info-panel" id="infoPanel"></div>

  <div class="nav-dots" id="navDots"></div>
  <div class="arrows">
    <button class="arrow-btn" id="btnPrev">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="arrow-btn" id="btnNext">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>



<script>
const NATIVE_W = 1054;
const NATIVE_H = 701;
const FILL = 0.52;

const projects = [
  { title:"Bloom Health",    role:"Mobile App · 2024",  desc:"Redesigned core tracking flows to reduce cognitive load, introducing ambient check-ins that fit naturally into daily routines.",                         pills:[{text:"↑ 38% retention",hi:true,icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"2 12 6 7 10 9 14 4\"/><\/svg>"},{text:"4.8 ★",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"8 2 10 6 14 6.5 11 9.5 11.5 14 8 12 4.5 14 5 9.5 2 6.5 6 6\"/><\/svg>"},{text:"iOS & Android",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4.5\" y=\"1\" width=\"7\" height=\"14\" rx=\"2\"/><line x1=\"7\" y1=\"12\" x2=\"9\" y2=\"12\"/><\/svg>"}],          color:"#c8a882", image:"CardCover/Card.png" },
  { title:"Altek AI",         role:"Freelance · 2025–present",   desc:"Improved the SaaS training dashboard hotels use to teach their AI assistants, supporting hotels like The Well, Britannia and The Thief with better guest answers and smoother operations.",                pills:[{text:"$100K ARR",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"8\" cy=\"8\" r=\"6\"/><path d=\"M8 5v6M6.5 6.5h3a1 1 0 010 2H7a1 1 0 000 2h3\"/><\/svg>"},{text:"60+ hotels",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"7\" width=\"12\" height=\"8\"/><path d=\"M5 15V9h6v6\"/><path d=\"M2 7l6-5 6 5\"/><\/svg>"},{text:"NOK 5M pre-seed",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2C6 2 4 8 4 14M4 14c2-4 5-6 8-7\"/><\/svg>"}],           color:"#2c4a6e", image:"CardCover/AltekCover.png" },
  { title:"Kron (Storebrand)", role:"Fintech Internship · 2025",    desc:"Designed the next step for Storebrands investment app, used by 80,000+ users. Led the full design process as sole UX designer, from 54 user interviews to an interactive prototype presented to executive leadership.",               pills:[{text:"54 interviews",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 8a3 3 0 100-6 3 3 0 000 6zM14 14s.5-5-4-5M6 8a3 3 0 100-6 3 3 0 000 6zM2 14s-.5-5 4-5\"/><\/svg>"},{text:"1,022 survey responses",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"2 12 6 7 10 9 14 4\"/><\/svg>"},{text:"80K+ app users",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 8a3 3 0 100-6 3 3 0 000 6zM14 14s.5-5-4-5M6 8a3 3 0 100-6 3 3 0 000 6zM2 14s-.5-5 4-5\"/><\/svg>"}],    color:"#b8d48a", image:"CardCover/KronCover.png" },
  { title:"Telenor",           role:"Telecom Internship · 2024",   desc:"Designed Business Pro for Norway's largest telecom, a simplified mobile CRM helping small and medium businesses manage customers with minimal manual input. Led UX across 51 participants and 6 prototype cycles.",                  pills:[{text:"↓ 40% complexity",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"2 12 6 7 10 9 14 4\"/><\/svg>"},{text:"51 participants",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 8a3 3 0 100-6 3 3 0 000 6zM14 14s.5-5-4-5M6 8a3 3 0 100-6 3 3 0 000 6zM2 14s-.5-5 4-5\"/><\/svg>"},{text:"86K+ B2B market",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"7\" width=\"12\" height=\"8\"/><path d=\"M5 15V9h6v6\"/><path d=\"M2 7l6-5 6 5\"/><\/svg>"}],   color:"#c47a9f", image:"CardCover/TelenorCover.png"},
  { title:"Nabostylisten",         role:"Part-time · 2024",      desc:"Redesigned the mobile booking flow for a beauty-at-home platform, cutting task time by 74.5% and lifting satisfaction from 3.1 to 7.5. The relaunch earned coverage in TV 2 and MinMote.",                              pills:[{text:"↓ 74.5% task time",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"2 12 6 7 10 9 14 4\"/><\/svg>"},{text:"3.1 → 7.5 satisfaction",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"8 2 10 6 14 6.5 11 9.5 11.5 14 8 12 4.5 14 5 9.5 2 6.5 6 6\"/><\/svg>"},{text:"TV 2 featured",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"1\" y=\"4\" width=\"14\" height=\"9\" rx=\"1\"/><line x1=\"5\" y1=\"15\" x2=\"11\" y2=\"15\"/><line x1=\"8\" y1=\"13\" x2=\"8\" y2=\"15\"/><\/svg>"}], color:"#2a4a2e", image:"CardCover/NabostylistenCover.png"},
  { title:"DFØ",          role:"University Project · 2024",     desc:"Streamlined DFØs hour registration for University of Oslo employees through participatory design with 15 users, cutting the process from 7 steps to 2 and reducing task time by 87%. Graded A.",          pills:[{text:"↓ 87% task time",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"2 12 6 7 10 9 14 4\"/><\/svg>"},{text:"100% rated it easier",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"8 2 10 6 14 6.5 11 9.5 11.5 14 8 12 4.5 14 5 9.5 2 6.5 6 6\"/><\/svg>"},{text:"70% → 100% success",icon:"<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"2 8 6 12 14 4\"/><\/svg>"}],  color:"#9f7ac4", image:"CardCover/DFØCover.png"},
];

const N = projects.length;

// Computed card dimensions — set once then updated on resize
let CW, CH, S;

function computeDimensions() {
  const sH = (window.innerHeight * FILL) / NATIVE_H;
  const sW = (window.innerWidth * 0.92) / NATIVE_W;
  S  = Math.min(sH, sW);
  CW = Math.round(NATIVE_W * S);
  CH = Math.round(NATIVE_H * S);
}

// ── Spring ────────────────────────────────────────────────────────
const KS=160, DS=24, MS=1;
let pos=0, vel=0, target=0;
let raf=null, lastTs=null;

function springStep(x,v,t,dt){
  const a=(-KS*(x-t)-DS*v)/MS;
  return [x+((v+(a*dt))*dt), v+(a*dt)];
}
function tick(ts){
  if(!lastTs) lastTs=ts;
  const dt=Math.min((ts-lastTs)/1000,0.05); lastTs=ts;
  [pos,vel]=springStep(pos,vel,target,dt);
  draw();
  if(Math.abs(pos-target)<0.0008 && Math.abs(vel)<0.001){
    pos=target; vel=0; draw(); raf=null; lastTs=null;
  } else {
    raf=requestAnimationFrame(tick);
  }
}
function kick(){ if(!raf){ lastTs=null; raf=requestAnimationFrame(tick); } }

// ── Snap ──────────────────────────────────────────────────────────
const SNAP_PAUSE=700, SNAP_THRESH=0.22, DELTA_SCALE=0.004;
let scrollAccum=0, snapLocked=false, snapTimer=null;
const snapBarWrap = document.getElementById('snapBarWrap');
const snapBarFill = document.getElementById('snapBarFill');

function lockSnap(){
  snapLocked=true; scrollAccum=0;
  snapBarWrap.classList.add('visible');
  snapBarFill.style.transition=`width ${SNAP_PAUSE}ms linear`;
  snapBarFill.style.width='100%';
  clearTimeout(snapTimer);
  snapTimer=setTimeout(()=>{
    snapLocked=false; scrollAccum=0;
    snapBarFill.style.transition='width 0.08s ease';
    snapBarFill.style.width='0%';
    snapBarWrap.classList.remove('visible');
  }, SNAP_PAUSE);
}

function handleDelta(delta){
  if(snapLocked) return;
  scrollAccum += delta * DELTA_SCALE;
  if(Math.abs(scrollAccum) >= SNAP_THRESH){
    const dir  = scrollAccum > 0 ? 1 : -1;
    const next = Math.round(target) + dir;
    if(next >= 0 && next < N){ goTo(next); lockSnap(); }
    else scrollAccum = 0;
  }
}

// ── Geometry ──────────────────────────────────────────────────────
function slotOf(offset){
  const a   = Math.abs(offset);
  const gap = CW * 0.72;
  return {
    x:       offset * gap,
    y:       a * a * 10,
    rot:     offset * 4,
    scale:   1 - a * 0.11,
    opacity: a > 2.3 ? 0 : 1 - Math.max(0, a - 0.5) * 0.46,
    zIndex:  Math.round(10 - a * 3),
  };
}

// ── DOM ───────────────────────────────────────────────────────────
const arcTrack  = document.getElementById('arcTrack');
const infoPanel = document.getElementById('infoPanel');
const navDots   = document.getElementById('navDots');

// Compute dimensions before building cards
computeDimensions();
arcTrack.style.height = CH + 'px';
snapBarWrap.style.width = CW + 'px';

// Now safe to build cards
const cardEls = projects.map((p, i) => {
  const card   = document.createElement('div'); card.className = 'card';
  card.style.width      = CW + 'px';
  card.style.height     = CH + 'px';
  card.style.marginLeft = (-CW / 2) + 'px';
  const swatch = document.createElement('div'); swatch.className = 'card-swatch';
  if (p.image) {
    swatch.style.backgroundImage = `url('${p.image}')`;
    swatch.style.backgroundSize = 'cover';
    swatch.style.backgroundPosition = 'center';
  } else {
    swatch.style.background = p.color;
  }
  const idx    = document.createElement('div'); idx.style.display = 'none';
  const logo = document.createElement('div');
  logo.style.cssText = `
    position:absolute; bottom:20px; left:20px;
    width:52px; height:52px; border-radius:12px;
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.28);
    overflow:hidden;
  `;
  const logos = {
    1: 'Logos/Altek Ai.svg',
    2: 'Logos/Kron.svg',
    3: 'Logos/Telenor.svg',
    4: 'Logos/Nabostylist.svg',
    5: 'Logos/DFØ.svg'
  };
  if (logos[i]) {
    const img = document.createElement('img');
    img.src = logos[i];
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
    logo.appendChild(img);
    logo.style.background = 'none';
    logo.style.backdropFilter = 'none';
    logo.style.webkitBackdropFilter = 'none';
    logo.style.border = 'none';
  }
  if (i === 0) logo.style.display = 'none';

  if (i !== 0) {
    const grad = document.createElement('div');
    grad.style.cssText = `
      position:absolute; bottom:0; left:0; right:0;
      height:15%; pointer-events:none;
      background:linear-gradient(to top, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.38) 25%, rgba(255,255,255,0.18) 55%, rgba(255,255,255,0.04) 80%, transparent 100%);
    `;
    card.append(swatch, grad, logo, idx);
  } else {
    card.append(swatch, logo, idx);
  }
  card.addEventListener('click', () => { if(Math.abs(i - target) > 0.4){ goTo(i); lockSnap(); } else if(i === 2){ window.location.href = 'kron.html'; } });
  arcTrack.insertBefore(card, snapBarWrap);
  return card;
});

const dotEls = projects.map((_, i) => {
  const d = document.createElement('div'); d.className = 'dot';
  d.addEventListener('click', () => { goTo(i); lockSnap(); });
  document.getElementById('navDots').appendChild(d);
  return d;
});

let lastInfoIdx = -1;
function updateInfo(idx){
  if(idx === lastInfoIdx) return;
  lastInfoIdx = idx;

  if(idx === 0){
    infoPanel.innerHTML = `
      <div style="animation:fadeUp 0.4s ease forwards; display:flex; flex-direction:column; align-items:center; gap:10px; padding-top:8px;">
        <div style="display:flex; gap:6px; align-items:center;">
          <span style="font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#BCBAB8;">Scroll to explore</span>
        </div>
      </div>`;
  } else {
    const p = projects[idx];
    infoPanel.innerHTML = `
      <div style="animation:fadeUp 0.4s ease forwards">
        <div class="info-eyebrow">${p.role}</div>
        <div class="info-title">${p.title}</div>
        <div class="info-desc">${p.desc}</div>
        <div class="info-pills">${p.pills.map(pl => `<span class="pill${pl.hi?' hi':''}">${pl.icon||''} ${pl.text}</span>`).join('')}</div>
      </div>`;
  }
}

function draw(){
  cardEls.forEach((card, i) => {
    const {x, y, rot, scale, opacity, zIndex} = slotOf(i - pos);
    card.style.transform  = `translateX(${x}px) translateY(${y}px) rotate(${rot}deg) scale(${scale})`;
    card.style.opacity    = opacity;
    card.style.zIndex     = zIndex;
    const d = Math.abs(i - pos);
    card.style.boxShadow  = d < 0.7 ? `0 20px 60px rgba(26,23,20,${(0.15*(1-d*1.3)).toFixed(3)})` : 'none';
  });

  updateInfo(Math.max(0, Math.min(N-1, Math.round(pos))));

  const ci = Math.max(0, Math.min(N-1, Math.round(pos)));
  dotEls.forEach((d, i) => d.classList.toggle('active', i === ci));
  document.getElementById('btnPrev').disabled = target <= 0;
  document.getElementById('btnNext').disabled = target >= N-1;
}

function goTo(i){ target = Math.max(0, Math.min(N-1, i)); kick(); }

// ── Input ─────────────────────────────────────────────────────────
window.addEventListener('wheel', e => { e.preventDefault(); handleDelta(e.deltaY); }, { passive:false });

let lastTy = 0;
window.addEventListener('touchstart', e => { lastTy = e.touches[0].clientY; }, { passive:true });
window.addEventListener('touchmove',  e => {
  const dy = lastTy - e.touches[0].clientY; lastTy = e.touches[0].clientY;
  handleDelta(dy / DELTA_SCALE * 0.003);
}, { passive:true });

document.getElementById('btnPrev').addEventListener('click', () => { if(!snapLocked){ goTo(Math.round(target)-1); lockSnap(); } });
document.getElementById('btnNext').addEventListener('click', () => { if(!snapLocked){ goTo(Math.round(target)+1); lockSnap(); } });

document.addEventListener('keydown', e => {
  if(snapLocked) return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){ goTo(Math.round(target)+1); lockSnap(); }
  if(e.key==='ArrowLeft' ||e.key==='ArrowUp')  { goTo(Math.round(target)-1); lockSnap(); }
});

window.addEventListener('resize', () => {
  computeDimensions();
  arcTrack.style.height   = CH + 'px';
  snapBarWrap.style.width = CW + 'px';
  cardEls.forEach(c => {
    c.style.width      = CW + 'px';
    c.style.height     = CH + 'px';
    c.style.marginLeft = (-CW / 2) + 'px';
  });
  draw();
});

// ── Init ──────────────────────────────────────────────────────────
updateInfo(0);
draw();
</script>
</body>
</html>
